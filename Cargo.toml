[package]
name = "wireguard-conf"
description = "Generate Wireguard configs and interfaces with code"
keywords = ["wireguard", "amneziawg", "builder", "config"]

version = "2.0.2"
edition = "2024"

rust-version = "1.88"

license = "MIT or Apache-2.0"
readme = "README.md"
homepage = "https://github.com/idkncc/wireguard-conf"
repository = "https://github.com/idkncc/wireguard-conf"

exclude = [
  "tests/",
  ".github/",
  "CONTRIBUTING.md",
  "QUICKSTART.md",
  "CHANGELOG.md",
  ".gitignore",
]

[features]
amneziawg = []
amneziawg-3 = ["amneziawg"]
serde = ["dep:serde", "either/serde", "ipnet/serde"]

[dependencies]
ipnet = "2.12"

# keys
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
base64 = "0.23"
rand = "0.10"

# other
thiserror = "2.0"
either = "1"

# internal helpers
derive_builder = "0.20"
itertools = "0.15"

# serde feature
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_assert = "0.8"
claims = "0.8"
indoc = "2"

# Doc all features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
